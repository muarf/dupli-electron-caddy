appId: com.dupli.app
productName: Duplicator
directories:
  output: dist
icon: icons/icon.png
publish:
  provider: github
  releaseType: release
  publishAutoUpdate: true
afterPack: scripts/afterpack-linux.js
files:
  - main-caddy.js
  - main.js
  - preload.js
  - icons/**/*
  - Caddyfile
  - php-fpm.conf
  - php-install-guide.html
  - "app/**/*"
  - "!app/.git/**/*"              # Exclure le dossier .git (non nécessaire pour l'app)
  - "!app/.phpunit.result.cache"   # Exclure le cache PHPUnit
  - ghostscript/**/*
  - caddy/**/*
  - utils/**/*
  - src/**/*
  - "!app/vendor/phpunit/**/*"
  - "!app/vendor/pestphp/**/*"
  - "!app/vendor/sebastian/**/*"
  - "!app/vendor/**/tests/**/*"
  - "!app/vendor/**/test/**/*"
  - "!app/vendor/**/docs/**/*"

extraResources:
  - from: icons/icon.png
    to: icons/icon.png
  # PHP sera inclus spécifiquement par plateforme (Windows/macOS oui, Linux non)
# asarUnpack configuré spécifiquement par plateforme pour éviter les erreurs de chemins longs
# Plus besoin d'exclure les liens symboliques car ils ont été supprimés
linux:
  target: 
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: icons
  category: Office
  executableName: Duplicator
  executableArgs: ["--no-sandbox", "--disable-gpu", "--disable-setuid-sandbox"]
  desktop:
    entry:
      Name: Duplicator
      Comment: Application de duplication de documents
      StartupWMClass: Duplicator
      Icon: duplicator
      Terminal: false
      Type: Application
      Categories: Office;
  maintainer: "Duplicator <support@duplicator.app>"
  # Configuration spécifique Linux - utilise PHP système, pas de binaires embarqués
  # Le dossier php/ est vidé avant le build dans le workflow (économie d'espace)
  # causée par des fichiers avec des chemins très longs dans app/
  asar: false
  artifactName: Duplicator-${version}-${arch}.${ext}

deb:
  synopsis: Outil de duplication, génération et impression de documents
  priority: optional
  depends:
    - libc6
    - libgtk-3-0
    - libnss3
    - libxss1
    - libasound2
    - libgbm1
    - libxshmfence1
  # Script de post-installation pour installer les icônes
  # Note: Le script postinst ne contient pas de macros electron-builder
  afterInstall: build/deb/postinst
mac:
  target:
    - target: dmg
      arch: [x64]
  category: public.app-category.productivity
  # Configuration spécifique macOS - inclut PHP
  files:
    - main-caddy.js
    - main.js
    - preload.js
    - icons/**/*
    - Caddyfile
    - php-fpm.conf
    - php-install-guide.html
    - app/**/*
    - ghostscript/**/*
    - caddy/**/*
    - utils/**/*
    - "php/**/*"  # Inclure PHP pour macOS
    - src/**/*
  asarUnpack:
    - "php/**/*"
    - "app/**/*"
    - "!app/.git/**/*"               # Exclure le dossier .git (non nécessaire pour l'app)
    - "ghostscript/**/*"
    - "caddy/**/*"
    - "Caddyfile"
    - "php-fpm.conf"
    - "src/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  forceCodeSigning: false
  # Désactiver ASAR sur Windows pour éviter l'erreur "pattern is too long"
  asar: false
  # Configuration pour la compatibilité Windows 8.1 Essai de correction
  requestedExecutionLevel: requireAdministrator
  # Configuration spécifique Windows - inclut PHP embarqué
  files:
    - main-caddy.js
    - main.js
    - preload.js
    - icons/**/*
    - Caddyfile
    - php-fpm.conf
    - app/php.ini  # Inclure explicitement php.ini pour Windows (nécessaire pour les extensions SQLite)
    - php-install-guide.html
    - app/**/*
    - ghostscript/**/*
    - caddy/**/*
    - utils/**/*
    - "php/**/*"  # Inclure PHP pour Windows
    - src/**/*
    - "!app/vendor/phpunit/**/*"
    - "!app/vendor/pestphp/**/*"
    - "!app/vendor/sebastian/**/*"
    - "!app/vendor/**/tests/**/*"
    - "!app/vendor/**/test/**/*"
    - "!app/vendor/**/docs/**/*"
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Duplicator
  deleteAppDataOnUninstall: false
  artifactName: Duplicator-Setup-${version}.exe
