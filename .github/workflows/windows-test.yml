name: Test Windows

on:
  push:
    branches:
      - feature/cross-platform-unification
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Enable PHP extensions
        run: |
          php -m | Select-String -Pattern "pdo_sqlite"
          if ($LASTEXITCODE -ne 0) {
            php -d "extension=sqlite3" -d "extension=pdo_sqlite" -r "echo 'Extensions loaded'"
          }

      - name: Install Composer and PHP dependencies
        run: |
          php -r "Copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php
          php composer.phar --version
          cd app
          php ../composer.phar install --optimize-autoloader --ignore-platform-reqs
          cd ..
          del composer-setup.php

      - name: Check PHP extensions
        run: php -m

      - name: Install system dependencies
        run: |
          choco install ghostscript -y
          choco install imagemagick -y

      - name: Download Caddy
        run: |
          Invoke-WebRequest -Uri https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_windows_amd64.zip -OutFile caddy.zip
          Expand-Archive caddy.zip -DestinationPath caddy -Force
          del caddy.zip
          ls caddy

      - name: Run PHP Tests (Pest)
        run: |
          cd app
          php -d "extension=sqlite3" -d "extension=pdo_sqlite" ./vendor/bin/pest --display-deprecations --display-errors --display-notices
          cd ..

      - name: Run JS Tests (Jest)
        run: |
          npm test -- --runInBand --forceExit