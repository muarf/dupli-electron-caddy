name: Build and Release Beta

on:
  workflow_dispatch:
  push:
    branches:
      - 'beta'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: get-version
        run: |
          git fetch --tags
          LAST_TAG=$(git tag -l "v2.0.*-beta*" | sort -V | tail -n 1)
          if [ -z "$LAST_TAG" ]; then
            NEXT_PATCH=1
          else
            LAST_PATCH=$(echo $LAST_TAG | sed -nE 's/v2\.0\.([0-9]+)-beta.*/\1/p')
            NEXT_PATCH=$((LAST_PATCH + 1))
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUM=$(date +%Y%m%d%H%M%S)
          VERSION="2.0.${NEXT_PATCH}-beta.${BUILD_NUM}+${SHORT_SHA}"
          TAG="v2.0.${NEXT_PATCH}-beta.${BUILD_NUM}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  test-linux-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@27853eb8b46dc01c33bf9fef67d98df2683c3be2 # v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, dom, curl, libxml, mbstring, zip
          tools: composer
          coverage: none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ghostscript imagemagick libpixman-1-dev xvfb

      - name: Install dependencies
        run: |
          npm install
          cd app
          composer install --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Run PHP Tests (Pest)
        run: |
          chmod +x app/tests/helpers/mock_binary.sh
          cd app
          ./vendor/bin/pest --display-deprecations --display-errors --display-notices
          cd ..

      - name: Download Caddy
        run: |
          wget -q https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_linux_amd64.tar.gz
          tar -xzf caddy_2.7.6_linux_amd64.tar.gz -C caddy/
          rm caddy_2.7.6_linux_amd64.tar.gz
          chmod +x caddy/caddy

      - name: Run JS Tests (Jest)
        run: xvfb-run npm test -- --runInBand --forceExit

  test-windows-beta:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@27853eb8b46dc01c33bf9fef67d98df2683c3be2 # v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, dom, curl, libxml, mbstring, zip
          tools: composer
          coverage: none

      - name: Install system dependencies (Choco)
        run: |
          choco install ghostscript --version 10.6.0 -y --no-progress
          choco install imagemagick -y

      - name: Install dependencies
        run: |
          npm install
          cd app
          composer install --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Run PHP Tests (Pest)
        working-directory: app
        run: |
          $phpPath = (Get-Command php).Source
          $pestPath = "vendor\bin\pest.bat"
          & $phpPath $pestPath --group=unit --display-deprecations --display-errors

      - name: Run JS Tests (Jest)
        run: npm test -- --runInBand --forceExit

  create-beta-release:
    needs: [get-version, test-linux-beta, test-windows-beta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Create or Update Beta Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ needs.get-version.outputs.tag }}';
            const version = '${{ needs.get-version.outputs.version }}';
            const shortSha = context.sha.substring(0, 7);
            
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`Release beta ${tag} existe déjà`);
            } catch (error) {
              if (error.status === 404) {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `Duplicator Beta v${version}`,
                  body: `## 🧪 Version Beta v${version}\n\n⚠️ **Ceci est une version BETA (Unified Monitoring)**\n\nCommit: \`${shortSha}\`\nBranch: \`${context.ref}\``,
                  draft: false,
                  prerelease: true
                });
                console.log(`✅ Release beta ${tag} créée`);
              } else {
                throw error;
              }
            }

  build-linux-beta:
    needs: [get-version, create-beta-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Composer and PHP dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Update tauri.conf.json for Beta
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            pkg.name = 'dupli-tauri-beta';
            pkg.productName = 'Duplicator Beta';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            const tauriPath = 'src-tauri/tauri.conf.json';
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            const cleanVersion = '$VERSION'.split('-')[0];
            tauriConf.version = cleanVersion;
            tauriConf.productName = 'Duplicator Beta';
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + '\n');
            console.log('Updated tauri.conf.json version to', cleanVersion);
          "

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ runner.os }}-v3

      - name: Download Tauri Sidecars
        run: node scripts/download-tauri-sidecars.js

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libfuse2 \
            ghostscript \
            libgs-dev

      - name: Build Tauri Linux Beta
        run: APPIMAGE_EXTRACT_AND_RUN=1 npx @tauri-apps/cli build --verbose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux Beta artifacts
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-beta:
    needs: [get-version, create-beta-release]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json for Beta
        run: |
          $VERSION = '${{ needs.get-version.outputs.version }}'
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            pkg.name = 'dupli-tauri-beta';
            pkg.productName = 'Duplicator Beta';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            const tauriPath = 'src-tauri/tauri.conf.json';
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            const cleanVersion = '$VERSION'.split('-')[0];
            tauriConf.version = cleanVersion;
            tauriConf.productName = 'Duplicator Beta';
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + '\n');
            console.log('Updated tauri.conf.json version to', cleanVersion);
          "

      - name: Install dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Composer and PHP dependencies
        run: |
          Invoke-WebRequest -Uri "https://getcomposer.org/download/latest-stable/composer.phar" -OutFile "composer.phar"
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Download Tauri Sidecars
        run: node scripts/download-tauri-sidecars.js

      - name: Build Tauri Windows Beta
        run: npx @tauri-apps/cli build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows Beta artifacts
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
