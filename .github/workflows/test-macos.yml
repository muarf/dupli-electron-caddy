name: Test macOS Build

on:
  push:
    branches: [ main, master, fix/macos-workflow ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permet de lancer manuellement

jobs:
  build-and-test-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupérer tout l'historique et les tags pour le versioning
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
        
      - name: Install Caddy and PHP via Homebrew
        run: |
          echo "Installation de Caddy et PHP via Homebrew..."
          brew install caddy php
          echo "Caddy et PHP installés via Homebrew"
          
          # Ajouter Homebrew au PATH si nécessaire
          if [ -d "/opt/homebrew/bin" ]; then
            export PATH="/opt/homebrew/bin:$PATH"
            echo "� PATH mis à jour pour Apple Silicon (/opt/homebrew/bin)"
          elif [ -d "/usr/local/bin" ]; then
            export PATH="/usr/local/bin:$PATH"
            echo "� PATH mis à jour pour Intel (/usr/local/bin)"
          fi
          
          # Vérifier que PHP est disponible
          if ! command -v php &> /dev/null; then
            echo "� PHP non trouvé dans le PATH après installation"
            echo "Recherche de PHP..."
            find /opt/homebrew /usr/local -name php -type f 2>/dev/null | head -5
            exit 1
          fi
          
          php --version
          echo "PHP version: $(php --version | head -1)"
          echo "Chemin PHP: $(which php)"
          
          # Copier le binaire Caddy vers le dossier caddy/
          mkdir -p caddy
          if [ -f "/opt/homebrew/bin/caddy" ]; then
            cp /opt/homebrew/bin/caddy caddy/caddy
            echo "� Caddy copié depuis /opt/homebrew/bin (Apple Silicon)"
          elif [ -f "/usr/local/bin/caddy" ]; then
            cp /usr/local/bin/caddy caddy/caddy
            echo "� Caddy copié depuis /usr/local/bin (Intel)"
          else
            echo "� Caddy non trouvé dans les emplacements attendus"
            which caddy || echo "Caddy non trouvé dans PATH"
            exit 1
          fi
          
          chmod +x caddy/caddy
          echo "Caddy copié: $(ls -la caddy/caddy | awk '{print $5}') bytes"
        
      - name: Install Composer and PHP dependencies
        run: |
          # S'assurer que PHP est dans le PATH
          if [ -d "/opt/homebrew/bin" ]; then
            export PATH="/opt/homebrew/bin:$PATH"
          elif [ -d "/usr/local/bin" ]; then
            export PATH="/usr/local/bin:$PATH"
          fi
          
          # Vérifier que PHP est disponible
          if ! command -v php &> /dev/null; then
            echo "� PHP non disponible pour l'installation de Composer"
            exit 1
          fi
          
          echo "Installation de Composer..."
          curl -sS https://getcomposer.org/installer | php
          php composer.phar --version
          
          echo "Installation des dépendances PHP..."
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..
          
          echo "Vérification de vendor/..."
          if [ -f "app/vendor/autoload.php" ]; then
            echo "� vendor/autoload.php créé avec succès"
          else
            echo "� ERREUR: vendor/autoload.php introuvable"
            exit 1
          fi
        
      - name: Copy PHP binaries to php/ directory
        run: |
          echo "=== Copie des binaires PHP vers php/ ==="
          
          # S'assurer que PHP est dans le PATH
          if [ -d "/opt/homebrew/bin" ]; then
            export PATH="/opt/homebrew/bin:$PATH"
          elif [ -d "/usr/local/bin" ]; then
            export PATH="/usr/local/bin:$PATH"
          fi
          
          # Créer le dossier php/ s'il n'existe pas
          mkdir -p php
          
          # Trouver le chemin PHP (Homebrew peut être dans /opt/homebrew ou /usr/local)
          PHP_BIN=$(which php)
          PHP_FPM_BIN=$(which php-fpm 2>/dev/null || echo "")
          
          if [ -z "$PHP_BIN" ]; then
            echo "� PHP non trouvé dans le PATH"
            echo "Recherche de PHP dans les emplacements Homebrew..."
            if [ -f "/opt/homebrew/bin/php" ]; then
              PHP_BIN="/opt/homebrew/bin/php"
              echo "� PHP trouvé dans /opt/homebrew/bin/php"
            elif [ -f "/usr/local/bin/php" ]; then
              PHP_BIN="/usr/local/bin/php"
              echo "� PHP trouvé dans /usr/local/bin/php"
            else
              echo "� PHP non trouvé dans les emplacements attendus"
              exit 1
            fi
          fi
          
          echo "Chemin PHP système: $PHP_BIN"
          
          # Copier le binaire PHP
          cp "$PHP_BIN" php/php
          chmod +x php/php
          echo "� PHP copié vers php/php"
          
          # Copier php-fpm si disponible
          if [ -z "$PHP_FPM_BIN" ]; then
            # Essayer de trouver php-fpm dans les mêmes emplacements
            if [ -f "/opt/homebrew/bin/php-fpm" ]; then
              PHP_FPM_BIN="/opt/homebrew/bin/php-fpm"
            elif [ -f "/usr/local/bin/php-fpm" ]; then
              PHP_FPM_BIN="/usr/local/bin/php-fpm"
            fi
          fi
          
          if [ -n "$PHP_FPM_BIN" ] && [ -f "$PHP_FPM_BIN" ]; then
            cp "$PHP_FPM_BIN" php/php-fpm
            chmod +x php/php-fpm
            echo "� php-fpm copié vers php/php-fpm"
          else
            echo "WARNING  php-fpm non disponible, utilisation du serveur PHP intégré"
          fi
          
          # Vérifier les fichiers copiés
          echo "DIR Contenu du dossier php/:"
          ls -la php/
          
          # Vérifier que les binaires sont exécutables
          if [ -x php/php ]; then
            echo "� php/php est exécutable"
            php/php --version
          else
            echo "� php/php n'est pas exécutable"
            exit 1
          fi
        
      - name: Verify PHP installation
        run: |
          # S'assurer que PHP est dans le PATH
          if [ -d "/opt/homebrew/bin" ]; then
            export PATH="/opt/homebrew/bin:$PATH"
          elif [ -d "/usr/local/bin" ]; then
            export PATH="/usr/local/bin:$PATH"
          fi
          
          echo "Vérification de l'installation PHP..."
          
          # Vérifier que PHP est disponible dans le système
          if command -v php &> /dev/null; then
            echo "� PHP système disponible"
            php --version
            echo "Chemin PHP: $(which php)"
          else
            echo "� PHP non disponible"
            exit 1
          fi
          
          # Vérifier que php-fpm est disponible
          if command -v php-fpm &> /dev/null; then
            echo "� php-fpm disponible"
            php-fpm --version
          else
            echo "WARNING  php-fpm non disponible, utilisation du serveur PHP intégré"
          fi
          
          # Vérifier que PHP est copié dans php/
          if [ -f "php/php" ]; then
            echo "� PHP copié dans php/php"
            php/php --version
          else
            echo "� PHP non copié dans php/"
            exit 1
          fi
        
      - name: Check package.json version
        run: |
          echo "=== Vérification de la version dans package.json ==="
          CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "Version actuelle: $CURRENT_VERSION"
          echo "� Utilisation de la version actuelle pour le build"
        
      - name: Build application
        run: |
          echo "=== Build de l'application macOS ==="
          # Nettoyer complètement dist avant le build
          rm -rf dist/
          rm -rf dist/mac/ 2>/dev/null || true
          # Supprimer aussi les dossiers Electron.app s'ils existent
          find . -name "Electron.app" -type d -exec rm -rf {} + 2>/dev/null || true
          # Build avec --publish=never pour éviter toute publication
          npm run build:caddy -- --mac --publish=never
          
          # Vérifier que le build a réussi
          if [ ! -d "dist/mac" ]; then
            echo "� Le build n'a pas créé le dossier dist/mac/"
            exit 1
          fi
          
          echo "� Build terminé avec succès"
        
      - name: Verify build artifacts
        run: |
          echo "=== Vérification des artifacts de build ==="
          
          if [ ! -d "dist" ]; then
            echo "� Dossier dist/ manquant"
            exit 1
          fi
          
          echo "DIR Contenu du dossier dist/:"
          ls -la dist/
          
          if [ ! -d "dist/mac" ]; then
            echo "� Dossier dist/mac/ manquant"
            exit 1
          fi
          
          echo "DIR Contenu du dossier dist/mac/:"
          ls -la dist/mac/
          
          # Vérifier les binaires dans l'app
          if [ ! -d "dist/mac/Duplicator.app" ]; then
            echo "� Application Duplicator.app manquante dans dist/mac/"
            exit 1
          fi
          
          echo "APP Structure de l'application:"
          find dist/mac/Duplicator.app -name "*.exe" -o -name "caddy" -o -name "php" 2>/dev/null | head -10 || echo "Aucun binaire trouvé"
          
          echo "CHECK Vérification des binaires Caddy et PHP:"
          CADDY_PATH="dist/mac/Duplicator.app/Contents/Resources/app.asar.unpacked/caddy/caddy"
          PHP_PATH="dist/mac/Duplicator.app/Contents/Resources/app.asar.unpacked/php/php"
          
          if [ -f "$CADDY_PATH" ]; then
            echo "� Caddy macOS présent dans l'app"
            ls -la "$CADDY_PATH"
            # Vérifier que caddy est exécutable
            if [ -x "$CADDY_PATH" ]; then
              echo "� Caddy est exécutable"
            else
              echo "WARNING  Caddy n'est pas exécutable"
            fi
          else
            echo "� Caddy macOS manquant dans l'app"
            echo "Recherche de Caddy dans l'app..."
            find dist/mac/Duplicator.app -name "caddy" 2>/dev/null || echo "Caddy non trouvé"
          fi
          
          if [ -f "$PHP_PATH" ]; then
            echo "� PHP macOS présent dans l'app"
            ls -la "$PHP_PATH"
            # Vérifier que PHP est exécutable
            if [ -x "$PHP_PATH" ]; then
              echo "� PHP est exécutable"
            else
              echo "WARNING  PHP n'est pas exécutable"
            fi
          else
            echo "� PHP macOS manquant dans l'app"
            echo "Recherche de PHP dans l'app..."
            find dist/mac/Duplicator.app -name "php" 2>/dev/null || echo "PHP non trouvé"
          fi
          
          # Vérifier le Caddyfile
          CADDYFILE_PATH="dist/mac/Duplicator.app/Contents/Resources/Caddyfile"
          if [ -f "$CADDYFILE_PATH" ]; then
            echo "� Caddyfile présent"
            echo "Contenu du Caddyfile:"
            cat "$CADDYFILE_PATH"
          else
            echo "WARNING  Caddyfile manquant dans Resources/"
            # Chercher ailleurs
            find dist/mac/Duplicator.app -name "Caddyfile" 2>/dev/null || echo "Caddyfile non trouvé"
          fi
          
          # Test de validation si les fichiers existent
          caddyExists=false
          caddyfileExists=false
          
          if [ -f "$CADDY_PATH" ]; then
            caddyExists=true
          fi
          
          if [ -f "$CADDYFILE_PATH" ]; then
            caddyfileExists=true
          fi
          
          if [ "$caddyExists" = true ] && [ "$caddyfileExists" = true ]; then
            echo "TOOL Validation de la configuration Caddy..."
            "$CADDY_PATH" validate --config "$CADDYFILE_PATH" || echo "WARNING  Validation Caddy échouée (non bloquant)"
          else
            echo "WARNING  Impossible de valider la configuration Caddy (fichiers manquants)"
            echo "Caddy existe: $caddyExists"
            echo "Caddyfile existe: $caddyfileExists"
          fi
          
          # Vérifier qu'un DMG a été créé
          if ls dist/mac/*.dmg 1> /dev/null 2>&1; then
            echo "� DMG créé:"
            ls -lh dist/mac/*.dmg
          else
            echo "WARNING  Aucun DMG trouvé dans dist/mac/"
          fi
        
      - name: Test application launch (short)
        continue-on-error: true
        run: |
          echo "=== Test de démarrage de l'application ==="
          
          # Vérifier que l'application existe
          if [ ! -d "dist/mac/Duplicator.app" ]; then
            echo "� Application non trouvée dans dist/mac/Duplicator.app"
            exit 1
          fi
          
          # Démarrer l'application
          open dist/mac/Duplicator.app
          echo "Application démarrée"
          
          # Attendre 15 secondes pour que l'app démarre
          sleep 15
          
          # Vérifier si les processus sont lancés
          phpProcess=$(ps aux | grep -i php | grep -v grep | head -1)
          caddyProcess=$(ps aux | grep -i caddy | grep -v grep | head -1)
          
          if [ -n "$phpProcess" ]; then
            echo "� Processus PHP détecté: $phpProcess"
          else
            echo "WARNING  Processus PHP non détecté"
          fi
          
          if [ -n "$caddyProcess" ]; then
            echo "� Processus Caddy détecté: $caddyProcess"
          else
            echo "WARNING  Processus Caddy non détecté"
          fi
          
          # Tester si le port 8000 répond (essayer plusieurs fois)
          PORT_RESPONDING=false
          for i in {1..5}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 | grep -q "200"; then
              echo "� Application répond sur le port 8000 (tentative $i)"
              PORT_RESPONDING=true
              break
            else
              echo "WAIT Attente du port 8000 (tentative $i/5)..."
              sleep 3
            fi
          done
          
          if [ "$PORT_RESPONDING" = false ]; then
            echo "WARNING  Application ne répond pas sur le port 8000 après 5 tentatives"
          fi
          
          # Arrêter l'application
          pkill -f "Duplicator" || true
          pkill -f "php.*127.0.0.1:8001" || true
          pkill -f "caddy" || true
          sleep 2
        
      - name: Create screenshots
        continue-on-error: true
        run: |
          echo "=== Capture d'écran de l'application ==="
          
          # Démarrer l'application
          open dist/mac/Duplicator.app
          echo "Application démarrée"
          
          # Attendre que l'application soit complètement chargée
          sleep 20
          
          # Prendre un screenshot avec screencapture (commande macOS native)
          screencapture -x screenshot.png
          
          echo "� Screenshot sauvegardé: screenshot.png"
          
          # Arrêter l'application
          pkill -f "Duplicator"
          pkill -f "php.*127.0.0.1:8001"
          pkill -f "caddy"
          
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshot
          path: screenshot.png
          retention-days: 7
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duplicator-macos-build
          path: dist/mac/
          retention-days: 7
          
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            *.log
            error
          if-no-files-found: ignore
          retention-days: 7
