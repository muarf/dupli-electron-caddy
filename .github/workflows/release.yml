name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Se déclenche sur les tags v1.3.30, v1.3.31, etc.
  workflow_run:
    workflows: ["Auto Tag on Push"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  get-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get latest tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Tag créé manuellement via push
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            # Tag créé par workflow auto-tag
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0)
            VERSION="${TAG#v}"
          fi
          
          echo "Tag trouvé: $TAG"
          echo "Version extraite: $VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  create-release:
    needs: get-tag
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.get-tag.outputs.tag }}';
            const version = '${{ needs.get-tag.outputs.version }}';
            
            // Vérifier si la release existe déjà
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`✅ Release ${tag} existe déjà`);
            } catch (error) {
              if (error.status === 404) {
                // Créer la release draft
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `Duplicator v${version}`,
                  body: `## 🎉 Release v${version}\n\n### 📦 Fichiers disponibles\n\nLes fichiers seront automatiquement uploadés par electron-builder.`,
                  draft: true,
                  prerelease: false
                });
                console.log(`✅ Release draft ${tag} créée`);
              } else {
                throw error;
              }
            }

  build-linux:
    needs: [get-tag, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ needs.get-tag.outputs.tag }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json version
        run: |
          echo "Mise à jour de package.json avec la version du tag..."
          VERSION="${{ needs.get-tag.outputs.version }}"
          echo "Version extraite: $VERSION"

          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
            console.log('✅ package.json mis à jour vers version', '$VERSION');
          "

          grep '\"version\"' package.json

      - name: Install dependencies
        run: npm install
      
      - name: Download Caddy for Linux
        run: |
          echo "Téléchargement de Caddy pour Linux..."
          wget -q https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_linux_amd64.tar.gz
          tar -xzf caddy_2.7.6_linux_amd64.tar.gz -C caddy/
          rm caddy_2.7.6_linux_amd64.tar.gz
          chmod +x caddy/caddy
          echo "✅ Caddy téléchargé"
      
      - name: Build Linux AppImage
        run: npm run build:caddy -- --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/tags/${{ needs.get-tag.outputs.tag }}
      
      - name: Verify build output
        run: |
          echo "Vérification des fichiers générés..."
          ls -lh dist/
          if [ -f dist/*.AppImage ]; then
            echo "✅ AppImage créée"
          fi
          if [ -f dist/latest-linux.yml ]; then
            echo "✅ latest-linux.yml créé"
          fi
  
  build-windows:
    needs: [get-tag, create-release]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ needs.get-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json version
        run: |
          echo "Mise à jour de package.json avec la version du tag..."
          $VERSION = '${{ needs.get-tag.outputs.version }}'
          echo "Version extraite: $VERSION"

          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = '${{ needs.get-tag.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
            console.log('✅ package.json mis à jour vers version', '${{ needs.get-tag.outputs.version }}');
          "

          Get-Content package.json | Select-String '"version"'

      - name: Install dependencies
        run: npm install
      
      - name: Download Caddy for Windows
        run: |
          echo "Téléchargement de Caddy pour Windows..."
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_windows_amd64.zip" -OutFile "caddy_windows.zip"
          Expand-Archive -Path "caddy_windows.zip" -DestinationPath "caddy" -Force
          Remove-Item "caddy_windows.zip"
          echo "✅ Caddy téléchargé"
      
      - name: Build Windows
        run: npm run build:caddy -- --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/tags/${{ needs.get-tag.outputs.tag }}
      
      - name: Verify build output
        run: |
          echo "Vérification des fichiers générés..."
          Get-ChildItem dist/ | Format-Table Name, Length
          if (Test-Path "dist/*.exe") {
            echo "✅ Exécutable Windows créé"
          }
          if (Test-Path "dist/latest.yml") {
            echo "✅ latest.yml créé"
          }

  publish-release:
    needs: [get-tag, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.get-tag.outputs.tag }}';
            
            // Récupérer la release
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            
            // Publier la release (passer de draft à published)
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false
            });
            
            console.log(`✅ Release ${tag} publiée`);