name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Se déclenche sur les tags v1.3.30, v1.3.31, etc.
  workflow_run:
    workflows: ["Auto Tag on Push"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get latest tag
        id: get-tag
        run: |
          # Toujours récupérer les tags pour être sûr d'avoir les derniers
          git fetch --tags --force
          
          if [ "${{ github.event_name }}" == "push" ]; then
            # Tag créé manuellement via push
            TAG="${{ github.ref_name }}"
            
            # Vérifier que le tag existe bien dans le repo
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "❌ ERREUR: Le tag $TAG n'existe pas dans le repository"
              echo "Vérification des tags disponibles:"
              git tag --list | tail -10
              exit 1
            fi
            
            VERSION="${TAG#v}"
          else
            # Tag créé par workflow auto-tag
            # Attendre un peu pour que le tag soit disponible (workflow auto-tag vient de le créer)
            sleep 2
            
            # Récupérer à nouveau les tags
            git fetch --tags --force
            
            # Essayer de récupérer le dernier tag
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            
            if [ -z "$TAG" ]; then
              echo "❌ ERREUR: Aucun tag trouvé dans le repository"
              echo "Vérification des tags disponibles:"
              git tag --list || echo "Aucun tag disponible"
              exit 1
            fi
            
            # Vérifier que le tag existe bien
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "❌ ERREUR: Le tag $TAG n'existe pas dans le repository"
              exit 1
            fi
            
            VERSION="${TAG#v}"
          fi
          
          # Valider le format de version (doit être X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ ERREUR: Format de version invalide: $VERSION (attendu: X.Y.Z)"
            exit 1
          fi
          
          echo "✅ Tag trouvé: $TAG"
          echo "✅ Version extraite: $VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  create-release:
    needs: get-tag
    runs-on: ubuntu-latest
    steps:
      - name: Create empty GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.get-tag.outputs.tag }}';
            const version = '${{ needs.get-tag.outputs.version }}';
            
            // Vérifier si la release existe déjà
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`✅ Release ${tag} existe déjà`);
            } catch (error) {
              if (error.status === 404) {
                // Créer une release vide (pas draft, publiée directement)
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `Duplicator v${version}`,
                  body: `## 🎉 Release v${version}\n\n### 📦 Fichiers disponibles\n\nLes fichiers seront automatiquement uploadés par les builds.`,
                  draft: false,
                  prerelease: false
                });
                console.log(`✅ Release ${tag} créée (vide, prête pour les uploads)`);
              } else {
                throw error;
              }
            }

  build-linux:
    needs: [get-tag, create-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0
          ref: ${{ needs.get-tag.outputs.tag }}

      - name: Clean cache and prepare
        run: |
          echo "🧹 Nettoyage du cache et préparation..."
          npm cache clean --force
          rm -rf node_modules/.cache dist/

      - name: Verify critical files
        run: |
          echo "🔍 Vérification des fichiers PHP critiques..."
          if [ ! -f 'app/view/partials/machine_item.html.php' ]; then
            echo "❌ machine_item.html.php manquant"
            exit 1
          fi
          if grep -q 'duplicopieur_active.*active' app/view/partials/machine_item.html.php; then
            echo "❌ machine_item.html.php contient les mauvaises valeurs (duplicopieur actif)"
            exit 1
          fi
          if grep -q 'photocopieur_active.*active' app/view/partials/machine_item.html.php; then
            echo "✅ machine_item.html.php a les bonnes valeurs (photocopieur actif)"
          else
            echo "❌ machine_item.html.php n'a pas les bonnes valeurs"
            grep -A2 -B2 "photocopieur_active" app/view/partials/machine_item.html.php || echo "Variable non trouvée"
            exit 1
          fi
          echo "✅ Tous les fichiers PHP critiques vérifiés"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json version
        run: |
          echo "Mise à jour de package.json avec la version du tag..."
          VERSION="${{ needs.get-tag.outputs.version }}"
          echo "Version extraite: $VERSION"

          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
            console.log('✅ package.json mis à jour vers version', '$VERSION');
          "

          grep '\"version\"' package.json

      - name: Install dependencies
        run: npm install
      
      - name: Install Composer and PHP dependencies
        run: |
          echo "Installation de Composer..."
          curl -sS https://getcomposer.org/installer | php
          php composer.phar --version
          
          echo "Installation des dépendances PHP..."
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..
          
          echo "Vérification de vendor/..."
          if [ -f "app/vendor/autoload.php" ]; then
            echo "✅ vendor/autoload.php créé avec succès"
          else
            echo "❌ ERREUR: vendor/autoload.php introuvable"
            exit 1
          fi
      
      - name: Download Tauri Sidecars
        run: node scripts/download-tauri-sidecars.js

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ runner.os }}-v2

      - name: Build Tauri Linux
        run: npx @tauri-apps/cli build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
      
      - name: Upload Linux artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-windows:
    needs: [get-tag, create-release, build-linux]
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ needs.get-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json version
        run: |
          echo "Mise à jour de package.json avec la version du tag..."
          $VERSION = '${{ needs.get-tag.outputs.version }}'
          echo "Version extraite: $VERSION"

          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = '${{ needs.get-tag.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
            console.log('✅ package.json mis à jour vers version', '${{ needs.get-tag.outputs.version }}');
          "

          Get-Content package.json | Select-String '"version"'

      - name: Install dependencies
        run: |
          npm config set msvs_version 2022
          $env:GYP_MSVS_VERSION="2022"
          npm install
      
      - name: Install Composer and PHP dependencies
        run: |
          echo "Installation de Composer..."
          # Télécharger Composer
          Invoke-WebRequest -Uri "https://getcomposer.org/download/latest-stable/composer.phar" -OutFile "composer.phar"
          php composer.phar --version
          
          echo "Installation des dépendances PHP..."
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..
          
          echo "Vérification de vendor/..."
          if (Test-Path "app/vendor/autoload.php") {
            echo "✅ vendor/autoload.php créé avec succès"
          } else {
            echo "❌ ERREUR: vendor/autoload.php introuvable"
            exit 1
          }
      
      - name: Download Tauri Sidecars
        run: node scripts/download-tauri-sidecars.js

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri Windows
        run: npx @tauri-apps/cli build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}