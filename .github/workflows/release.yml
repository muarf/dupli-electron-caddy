name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Se déclenche sur les tags v1.3.30, v1.3.31, etc.
  workflow_run:
    workflows: ["Auto Tag on Push"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  get-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get latest tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Tag créé manuellement via push
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            # Tag créé par workflow auto-tag
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0)
            VERSION="${TAG#v}"
          fi
          
          echo "Tag trouvé: $TAG"
          echo "Version extraite: $VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  create-release:
    needs: get-tag
    runs-on: ubuntu-latest
    steps:
      - name: Create empty GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.get-tag.outputs.tag }}';
            const version = '${{ needs.get-tag.outputs.version }}';
            
            // Vérifier si la release existe déjà
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`✅ Release ${tag} existe déjà`);
            } catch (error) {
              if (error.status === 404) {
                // Créer une release vide (pas draft, publiée directement)
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `Duplicator v${version}`,
                  body: `## 🎉 Release v${version}\n\n### 📦 Fichiers disponibles\n\nLes fichiers seront automatiquement uploadés par les builds.`,
                  draft: false,
                  prerelease: false
                });
                console.log(`✅ Release ${tag} créée (vide, prête pour les uploads)`);
              } else {
                throw error;
              }
            }

  build-linux:
    needs: [get-tag, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0
          ref: ${{ needs.get-tag.outputs.tag }}

      - name: Clean cache and prepare
        run: |
          echo "🧹 Nettoyage du cache et préparation..."
          npm cache clean --force
          rm -rf node_modules/.cache ~/.electron* ~/.cache/electron* dist/

      - name: Verify critical files
        run: |
          echo "🔍 Vérification des fichiers PHP critiques..."
          if [ ! -f 'app/view/partials/machine_item.html.php' ]; then
            echo "❌ machine_item.html.php manquant"
            exit 1
          fi
          if grep -q 'duplicopieur_active.*active' app/view/partials/machine_item.html.php; then
            echo "❌ machine_item.html.php contient les mauvaises valeurs (duplicopieur actif)"
            exit 1
          fi
          if grep -q 'photocopieur_active.*active' app/view/partials/machine_item.html.php; then
            echo "✅ machine_item.html.php a les bonnes valeurs (photocopieur actif)"
          else
            echo "❌ machine_item.html.php n'a pas les bonnes valeurs"
            grep -A2 -B2 "photocopieur_active" app/view/partials/machine_item.html.php || echo "Variable non trouvée"
            exit 1
          fi
          echo "✅ Tous les fichiers PHP critiques vérifiés"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json version
        run: |
          echo "Mise à jour de package.json avec la version du tag..."
          VERSION="${{ needs.get-tag.outputs.version }}"
          echo "Version extraite: $VERSION"

          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
            console.log('✅ package.json mis à jour vers version', '$VERSION');
          "

          grep '\"version\"' package.json

      - name: Install dependencies
        run: npm install
      
      - name: Install Composer and PHP dependencies
        run: |
          echo "Installation de Composer..."
          curl -sS https://getcomposer.org/installer | php
          php composer.phar --version
          
          echo "Installation des dépendances PHP..."
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..
          
          echo "Vérification de vendor/..."
          if [ -f "app/vendor/autoload.php" ]; then
            echo "✅ vendor/autoload.php créé avec succès"
          else
            echo "❌ ERREUR: vendor/autoload.php introuvable"
            exit 1
          fi
      
      - name: Download Caddy for Linux
        run: |
          echo "Téléchargement de Caddy pour Linux..."
          wget -q https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_linux_amd64.tar.gz
          tar -xzf caddy_2.7.6_linux_amd64.tar.gz -C caddy/
          rm caddy_2.7.6_linux_amd64.tar.gz
          chmod +x caddy/caddy
          echo "✅ Caddy téléchargé"
      
      - name: Build Linux (AppImage + deb)
        run: |
          echo "🛠️ Build AppImage..."
          npm run build:caddy -- --linux --publish=never
          echo "🛠️ Build deb..."
          npx --yes electron-builder --config electron-builder-caddy.yml -l deb --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/tags/${{ needs.get-tag.outputs.tag }}
      
      - name: Upload Linux artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify build output
        run: |
          echo "Vérification des fichiers générés..."
          ls -lh dist/ || true
          if [ -f dist/*.AppImage ]; then
            echo "✅ AppImage créée"
          fi
          if ls dist/*.deb >/dev/null 2>&1; then
            echo "✅ Paquet .deb créé"
          fi
          if [ -f dist/latest-linux.yml ]; then
            echo "✅ latest-linux.yml créé"
          fi

      - name: Verify ASAR content
        run: |
          echo "🔍 Vérification du contenu ASAR..."
          APPIMAGE_FILE=$(ls dist/*.AppImage | head -1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "❌ Aucune AppImage trouvée"
            exit 1
          fi
          echo "Extraction de $APPIMAGE_FILE..."
          $APPIMAGE_FILE --appimage-extract >/dev/null 2>&1
          if grep -q 'photocopieur_active.*active' squashfs-root/resources/app.asar.unpacked/app/view/partials/machine_item.html.php; then
            echo "✅ ASAR contient les bonnes valeurs PHP"
          else
            echo "❌ ASAR contient les mauvaises valeurs PHP"
            echo "Contenu trouvé dans machine_item.html.php:"
            grep -A2 -B2 "photocopieur_active\|duplicopieur_active" squashfs-root/resources/app.asar.unpacked/app/view/partials/machine_item.html.php || echo "Variables non trouvées"
            exit 1
          fi
          echo "✅ Vérification ASAR terminée avec succès"
  
  build-windows:
    needs: [get-tag, create-release, build-linux]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ needs.get-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json version
        run: |
          echo "Mise à jour de package.json avec la version du tag..."
          $VERSION = '${{ needs.get-tag.outputs.version }}'
          echo "Version extraite: $VERSION"

          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = '${{ needs.get-tag.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
            console.log('✅ package.json mis à jour vers version', '${{ needs.get-tag.outputs.version }}');
          "

          Get-Content package.json | Select-String '"version"'

      - name: Install dependencies
        run: npm install
      
      - name: Install Composer and PHP dependencies
        run: |
          echo "Installation de Composer..."
          # Télécharger Composer
          Invoke-WebRequest -Uri "https://getcomposer.org/download/latest-stable/composer.phar" -OutFile "composer.phar"
          php composer.phar --version
          
          echo "Installation des dépendances PHP..."
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..
          
          echo "Vérification de vendor/..."
          if (Test-Path "app/vendor/autoload.php") {
            echo "✅ vendor/autoload.php créé avec succès"
          } else {
            echo "❌ ERREUR: vendor/autoload.php introuvable"
            exit 1
          }
      
      - name: Download Caddy for Windows
        run: |
          echo "Téléchargement de Caddy pour Windows..."
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_windows_amd64.zip" -OutFile "caddy_windows.zip"
          Expand-Archive -Path "caddy_windows.zip" -DestinationPath "caddy" -Force
          Remove-Item "caddy_windows.zip"
          echo "✅ Caddy téléchargé"
      
      - name: Build Windows
        run: npm run build:caddy -- --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/tags/${{ needs.get-tag.outputs.tag }}
      
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify build output
        run: |
          echo "Vérification des fichiers générés..."
          Get-ChildItem dist/ | Format-Table Name, Length
          if (Test-Path "dist/*.exe") {
            echo "✅ Exécutable Windows créé"
          }
          if (Test-Path "dist/latest.yml") {
            echo "✅ latest.yml créé"
          }