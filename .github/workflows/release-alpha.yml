name: Build and Release Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - 'alpha'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: get-version
        run: |
          git fetch --tags
          LAST_TAG=$(git tag -l "v2.0.*-alpha*" | sort -V | tail -n 1)
          if [ -z "$LAST_TAG" ]; then
            NEXT_PATCH=1
          else
            LAST_PATCH=$(echo $LAST_TAG | sed -nE 's/v2\.0\.([0-9]+)-alpha.*/\1/p')
            NEXT_PATCH=$((LAST_PATCH + 1))
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUM=$(date +%Y%m%d%H%M%S)
          VERSION="2.0.${NEXT_PATCH}-alpha.${BUILD_NUM}+${SHORT_SHA}"
          TAG="v2.0.${NEXT_PATCH}-alpha.${BUILD_NUM}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  test-linux-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, dom, curl, libxml, mbstring, zip, gd
          tools: composer
          coverage: none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ghostscript imagemagick libpixman-1-dev xvfb

      - name: Install dependencies
        run: |
          npm install
          cd app
          composer install --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Run PHP Tests (Pest)
        run: |
          chmod +x app/tests/helpers/mock_binary.sh
          cd app
          ./vendor/bin/pest --display-deprecations --display-errors --display-notices
          cd ..

      - name: Download Caddy
        run: |
          wget -q https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_linux_amd64.tar.gz
          tar -xzf caddy_2.7.6_linux_amd64.tar.gz -C caddy/
          rm caddy_2.7.6_linux_amd64.tar.gz
          chmod +x caddy/caddy

      - name: Run JS Tests (Jest)
        run: xvfb-run npm test -- --runInBand --forceExit

  test-windows-alpha:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, dom, curl, libxml, mbstring, zip
          tools: composer
          coverage: none

      - name: Install system dependencies (Choco)
        run: |
          choco install ghostscript --version 10.6.0 -y --no-progress
          choco install imagemagick -y

      - name: Install dependencies
        run: |
          npm install
          cd app
          composer install --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Run PHP Tests (Pest)
        working-directory: app
        run: |
          $phpPath = (Get-Command php).Source
          $pestPath = "vendor\bin\pest.bat"
          & $phpPath $pestPath --group=unit --display-deprecations --display-errors

      - name: Run JS Tests (Jest)
        run: npm test -- --runInBand --forceExit

  create-alpha-release:
    needs: [get-version, test-linux-alpha, test-windows-alpha]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create or Update Alpha Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ needs.get-version.outputs.tag }}';
            const version = '${{ needs.get-version.outputs.version }}';
            const shortSha = context.sha.substring(0, 7);

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`Release alpha ${tag} existe déjà`);
            } catch (error) {
              if (error.status === 404) {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: `Duplicator Alpha v${version}`,
                  body: `## 🚀 Version Alpha v${version}\n\n⚠️ **Ceci est une version ALPHA (Studio Integration)**\n\nCommit: \`${shortSha}\`\nBranch: \`${context.ref}\``,
                  draft: false,
                  prerelease: true
                });
                console.log(`✅ Release alpha ${tag} créée`);
              } else {
                throw error;
              }
            }

  build-linux-alpha:
    needs: [get-version, create-alpha-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Composer and PHP dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Update tauri.conf.json for Alpha
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            pkg.name = 'dupli-tauri-alpha';
            pkg.productName = 'Duplicator Alpha';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            const tauriPath = 'src-tauri/tauri.conf.json';
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            const cleanVersion = '$VERSION'.split('-')[0];
            tauriConf.version = cleanVersion;
            tauriConf.productName = 'Duplicator Alpha';
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + '\n');
            console.log('Updated tauri.conf.json version to', cleanVersion);
          "

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ runner.os }}-v2

      - name: Download Tauri Sidecars
        run: node scripts/download-tauri-sidecars.js

      - name: Build Tauri Linux Alpha
        run: npx @tauri-apps/cli build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Linux Alpha artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/appimage/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-alpha:
    needs: [get-version, create-alpha-release]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Update package.json and tauri.conf.json for Alpha
        run: |
          $VERSION = '${{ needs.get-version.outputs.version }}'
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            pkg.name = 'dupli-tauri-alpha';
            pkg.productName = 'Duplicator Alpha';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            const tauriPath = 'src-tauri/tauri.conf.json';
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            const cleanVersion = '$VERSION'.split('-')[0];
            tauriConf.version = cleanVersion;
            tauriConf.productName = 'Duplicator Alpha';
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + '\n');
            console.log('Updated tauri.conf.json version to', cleanVersion);
          "

      - name: Install dependencies
        run: |
          npm install

      - name: Install Composer and PHP dependencies
        run: |
          Invoke-WebRequest -Uri "https://getcomposer.org/download/latest-stable/composer.phar" -OutFile "composer.phar"
          cd app
          php ../composer.phar install --no-dev --optimize-autoloader --ignore-platform-reqs
          cd ..

      - name: Download Tauri Sidecars
        run: |
          node scripts/download-tauri-sidecars.js

      - name: Build Tauri Windows Alpha
        run: npx @tauri-apps/cli build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows Alpha artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-updater:
    needs: [get-version, build-linux-alpha, build-windows-alpha]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: alpha

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.get-version.outputs.tag }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          # Wait 15 seconds for Github to propagate release assets
          sleep 15
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets')
          
          LINUX_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".AppImage.tar.gz")) | .url')
          LINUX_SIG_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".AppImage.tar.gz.sig")) | .url')
          
          WIN_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("setup.exe.zip")) | .url')
          WIN_SIG_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("setup.exe.zip.sig")) | .url')
          
          LINUX_SIG=""
          WIN_SIG=""
          
          if [ "$LINUX_SIG_URL" != "null" ] && [ -n "$LINUX_SIG_URL" ]; then
            LINUX_SIG=$(curl -sL "$LINUX_SIG_URL")
          fi
          
          if [ "$WIN_SIG_URL" != "null" ] && [ -n "$WIN_SIG_URL" ]; then
            WIN_SIG=$(curl -sL "$WIN_SIG_URL")
          fi
          
          mkdir -p updater
          cat <<EOF > updater/latest.json
          {
            "version": "v$VERSION",
            "notes": "Alpha release version $VERSION",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$LINUX_URL"
              },
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              }
            }
          }
          EOF
          
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          git commit -m "chore(updater): update latest.json for version ${{ needs.get-version.outputs.version }} [skip ci]" || exit 0
          git push origin alpha