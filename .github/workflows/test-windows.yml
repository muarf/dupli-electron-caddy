name: Test Windows Build

on:
  push:
    branches: [ main, master, fix-linux-appimage ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permet de lancer manuellement

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupérer tout l'historique et les tags pour le versioning
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
        
      - name: Download Caddy for Windows
        run: |
          echo "Téléchargement de Caddy pour Windows..."
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v2.7.6/caddy_2.7.6_windows_amd64.zip" -OutFile "caddy_windows.zip"
          Expand-Archive -Path "caddy_windows.zip" -DestinationPath "caddy" -Force
          Remove-Item "caddy_windows.zip"
          echo "Caddy téléchargé: $(Get-Item caddy/caddy.exe | Select-Object -ExpandProperty Length) bytes"
        
      - name: Verify PHP binaries
        run: |
          echo "Vérification des binaires PHP inclus..."
          
          if (Test-Path "php/php.exe") {
            echo "✅ php.exe trouvé"
            & "php/php.exe" --version
            echo "Taille: $((Get-Item 'php/php.exe').Length) bytes"
          } else {
            echo "❌ php.exe manquant dans le repo"
            echo "Contenu du dossier php/:"
            if (Test-Path "php") {
              dir php/
            } else {
              echo "Dossier php/ n'existe pas"
            }
            exit 1
          }
          
          echo "Vérification des DLL nécessaires:"
          $required_dlls = @("php8.dll", "libsqlite3.dll", "vcruntime140.dll", "msvcp140.dll")
          foreach ($dll in $required_dlls) {
            if (Test-Path "php/$dll") {
              echo "✅ $dll trouvé"
            } else {
              echo "❌ $dll manquant (CRITIQUE pour Windows)"
            }
          }
        
      - name: Check package.json version
        run: |
          echo "=== Vérification de la version dans package.json ==="
          $currentVersion = (Get-Content "package.json" | ConvertFrom-Json).version
          echo "Version actuelle: $currentVersion"
          echo "✅ Utilisation de la version actuelle pour le build"
        
      - name: Build Windows app
        run: npm run build:caddy -- --win --publish=never
        
      - name: Verify build output
        run: |
          echo "=== Vérification du build ==="
          if (Test-Path "dist/win-unpacked/Duplicator.exe") {
            echo "✅ Duplicator.exe existe"
            $size = (Get-Item "dist/win-unpacked/Duplicator.exe").Length / 1MB
            echo "   Taille: $([math]::Round($size, 2)) MB"
          } else {
            echo "❌ Duplicator.exe manquant"
            exit 1
          }
          
          if (Test-Path "dist/win-unpacked/resources/app/caddy/caddy.exe") {
            echo "✅ caddy.exe existe"
          } else {
            echo "❌ caddy.exe manquant"
          }
          
          if (Test-Path "dist/win-unpacked/resources/app/php/php.exe") {
            echo "✅ php.exe existe"
          } else {
            echo "❌ php.exe manquant"
          }
          
          if (Test-Path "dist/win-unpacked/resources/app/Caddyfile") {
            echo "✅ Caddyfile existe"
          } else {
            echo "❌ Caddyfile manquant"
          }
          
          echo ""
          echo "=== Structure complète ==="
          tree dist/win-unpacked/resources/ -L 2
        
      - name: Test Caddy binary
        run: |
          echo "=== Test de Caddy ==="
          & "dist/win-unpacked/resources/app/caddy/caddy.exe" version
        
      - name: Test PHP binary
        run: |
          echo "=== Test de PHP ==="
          & "dist/win-unpacked/resources/app/php/php.exe" --version
        
      - name: Test Caddyfile validation
        run: |
          echo "=== Validation du Caddyfile ==="
          echo "🔍 Vérification des binaires..."
          
          if (Test-Path "dist/win-unpacked/resources/app/caddy/caddy.exe") {
            echo "✅ Caddy Windows présent"
            Get-Item "dist/win-unpacked/resources/app/caddy/caddy.exe" | Select-Object Name, Length
          } else {
            echo "❌ Caddy Windows manquant"
            echo "Contenu du dossier caddy:"
            Get-ChildItem "dist/win-unpacked/resources/app/caddy/" -ErrorAction SilentlyContinue
          }
          
          if (Test-Path "dist/win-unpacked/resources/app/Caddyfile") {
            echo "✅ Caddyfile présent"
            Get-Content "dist/win-unpacked/resources/app/Caddyfile"
          } else {
            echo "❌ Caddyfile manquant"
          }
          
          # Test de validation si les fichiers existent
          $caddyExists = Test-Path "dist/win-unpacked/resources/app/caddy/caddy.exe"
          $caddyfileExists = Test-Path "dist/win-unpacked/resources/app/Caddyfile"
          
          if ($caddyExists -and $caddyfileExists) {
            echo "🔧 Validation de la configuration Caddy..."
            & "dist/win-unpacked/resources/app/caddy/caddy.exe" validate --config "dist/win-unpacked/resources/app/Caddyfile"
          } else {
            echo "⚠️  Impossible de valider la configuration Caddy (fichiers manquants)"
            echo "Caddy existe: $caddyExists"
            echo "Caddyfile existe: $caddyfileExists"
          }
        
      - name: Test application launch (short)
        run: |
          echo "=== Test de démarrage de l'application ==="
          $app = Start-Process "dist/win-unpacked/Duplicator.exe" -PassThru
          echo "Application démarrée avec PID: $($app.Id)"
          
          # Attendre 15 secondes pour que l'app démarre
          Start-Sleep -Seconds 15
          
          # Vérifier si les processus sont lancés
          $phpProcess = Get-Process | Where-Object { $_.ProcessName -like "*php*" }
          $caddyProcess = Get-Process | Where-Object { $_.ProcessName -like "*caddy*" }
          
          if ($phpProcess) {
            echo "✅ Processus PHP détecté: $($phpProcess.ProcessName)"
          } else {
            echo "⚠️  Processus PHP non détecté"
          }
          
          if ($caddyProcess) {
            echo "✅ Processus Caddy détecté: $($caddyProcess.ProcessName)"
          } else {
            echo "⚠️  Processus Caddy non détecté"
          }
          
          # Tester si le port 8000 répond
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000" -TimeoutSec 5 -UseBasicParsing
            echo "✅ Application répond sur le port 8000"
            echo "   Status: $($response.StatusCode)"
          } catch {
            echo "⚠️  Application ne répond pas sur le port 8000"
            echo "   Erreur: $_"
          }
          
          # Arrêter l'application
          Stop-Process -Id $app.Id -Force
          
          # Nettoyer les processus orphelins
          Get-Process | Where-Object { $_.ProcessName -like "*php*" -or $_.ProcessName -like "*caddy*" } | Stop-Process -Force
        
      - name: Create screenshots
        continue-on-error: true
        run: |
          echo "=== Capture d'écran de l'application ==="
          
          # Démarrer l'application
          $app = Start-Process "dist/win-unpacked/Duplicator.exe" -PassThru
          echo "Application démarrée avec PID: $($app.Id)"
          
          # Attendre que l'application soit complètement chargée
          Start-Sleep -Seconds 20
          
          # Prendre un screenshot avec PowerShell
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          
          $screenshotPath = "screenshot.png"
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          
          echo "✅ Screenshot sauvegardé: $screenshotPath"
          
          # Arrêter l'application
          Stop-Process -Id $app.Id -Force
          Get-Process | Where-Object { $_.ProcessName -like "*php*" -or $_.ProcessName -like "*caddy*" } | Stop-Process -Force
          
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot
          path: screenshot.png
          retention-days: 7
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duplicator-windows-build
          path: dist/win-unpacked/
          retention-days: 7
        
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            C:\Users\runneradmin\AppData\Local\Temp\duplicator_caddy_errors.log
            C:\Users\runneradmin\AppData\Local\Temp\duplicator_php_errors.log
          retention-days: 3
          if-no-files-found: ignore
        continue-on-error: true
        
      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Création de la release GitHub ==="
          
          # Vérifier les packages disponibles
          echo "Packages disponibles:"
          if (Test-Path "dist/Duplicator-*.exe") {
            echo "✅ Installateur NSIS trouvé"
            Get-ChildItem "dist/Duplicator-*.exe" | ForEach-Object { echo "  - $($_.Name)" }
          }
          if (Test-Path "dist/Duplicator-*-win.zip") {
            echo "✅ Version portable ZIP trouvée"
            Get-ChildItem "dist/Duplicator-*-win.zip" | ForEach-Object { echo "  - $($_.Name)" }
          }
          
          # Obtenir la version depuis Git tags en priorité
          $version = $null
          
          # 1. Essayer de récupérer le dernier tag Git (méthode améliorée)
          echo "Recherche des tags Git..."
          
          # Méthode alternative: récupérer directement depuis git tag --list
          try {
            $allTags = git tag --list "v*" --sort=-version:refname
            if ($allTags -and $allTags.Length -gt 0) {
              $lastTag = $allTags[0]
              echo "Dernier tag trouvé: $lastTag"
              
              # Extraire la version sans le 'v' du tag
              $version = $lastTag -replace '^v', ''
              echo "Version depuis Git tag: $lastTag -> $version"
              
              # Calculer la prochaine version (patch incrémenté)
              $versionParts = $version -split '\.'
              if ($versionParts.Length -eq 3) {
                $patch = [int]$versionParts[2] + 1
                $version = "$($versionParts[0]).$($versionParts[1]).$patch"
                echo "✅ Prochaine version calculée: $version"
              } else {
                echo "⚠️ Format de version inattendu: $version"
                $version = $null
              }
            } else {
              echo "⚠️ Aucun tag trouvé avec 'git tag --list'"
              $version = $null
            }
          } catch {
            echo "❌ Erreur lors de la récupération des tags: $($_.Exception.Message)"
            $version = $null
          }
          
          # 2. Fallback: utiliser package.json si aucun tag
          if (-not $version) {
            if (Test-Path "package.json") {
              $packageJson = Get-Content "package.json" | ConvertFrom-Json
              $version = $packageJson.version
              echo "Version depuis package.json: $version"
            }
          }
          
          # 3. Fallback final: version basée sur les commits
          if (-not $version) {
            $commitCount = git rev-list --count HEAD
            $version = "1.0.$commitCount"
            echo "Version depuis commit count: $version"
          }
          
          echo "Version détectée: $version"
          
          # Vérifier si la release existe déjà
          $releaseExists = $false
          try {
            gh release view "v$version" >$null 2>&1
            $releaseExists = $true
            echo "Release v$version existe déjà"
          } catch {
            echo "Release v$version n'existe pas, création..."
            $releaseExists = $false
          }
          
          if (-not $releaseExists) {
            # Créer la release
            gh release create "v$version" `
              --title "Duplicator v$version - Windows" `
              --notes "
              🚀 **Duplicator v$version - Windows Release**
              
              **Corrections:**
              ✅ SQLite extensions ajoutées (php_sqlite3.dll, php_pdo_sqlite.dll)
              ✅ Visual C++ Runtime DLLs incluses 
              ✅ Application portable Windows prête
              
              **Ressources incluses:**
              🔹 Caddy Web Server v2.7.6
              🔹 PHP ${version}-Windows avec SQLite 
              🔹 Ghostscript pour PDF
              🔹 Extensions PDO SQLite corrigées
              
              **Instructions:**
              1. Télécharger le package souhaité (NSIS installer ou ZIP portable)
              2. Lancer l'application (Duplicator.exe)
              3. L'interface web s'ouvrira automatiquement
              
              **Système requis:**
              - Windows 10/11 (64-bit)
              ⚠️ Plus besoin d'installer Visual C++ Redistributable !
              
              ---
              *Build automatique depuis GitHub Actions* 🏗️
              " `
              --generate-notes `
              "dist/Duplicator-*-win.zip" `
              "dist/Duplicator-*.exe" 2>$null || echo "Erreur création release"
              
            echo "✅ Release GitHub créée: v$version"
          } else {
            echo "ℹ️ Release déjà existante, mise à jour des assets..."
            
            # Upload des nouveaux assets dans la release existante
            $zipFile = Get-ChildItem "dist/Duplicator-*-win.zip" | Select-Object -First 1
            $exeFile = Get-ChildItem "dist/Duplicator-*.exe" | Select-Object -First 1
            
            if ($zipFile) {
              gh release upload "v$version" $zipFile.FullName --clobber 2>$null || echo "Erreur upload ZIP"
            }
            if ($exeFile) {
              gh release upload "v$version" $exeFile.FullName --clobber 2>$null || echo "Erreur upload EXE" 
            }
            
            echo "✅ Assets mis à jour dans la release existante"
          }
        
      - name: Test summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "✅ TEST WINDOWS TERMINÉ"
          echo "════════════════════════════════════════"
          echo ""
          echo "Les artifacts sont disponibles dans l'onglet Actions"
          echo "Vous pouvez télécharger le build et les logs"

