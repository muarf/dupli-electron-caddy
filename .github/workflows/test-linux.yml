name: Test Linux Build

on:
  push:
    branches: [ main, master, fix-linux-appimage, feature/cross-platform-unification ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    
    steps:
      - name: Free up disk space on GitHub Actions runner
        run: |
          echo "=== Espace disque AVANT nettoyage ==="
          df -h /
          echo ""
          echo "Nettoyage des répertoires temporaires d'electron-builder..."
          sudo rm -rf /tmp/t-* || true
          echo "✅ Répertoires temporaires nettoyés"
          echo ""
          echo "Suppression de fichiers inutiles du runner GitHub Actions..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean || true
          echo ""
          echo "=== Espace disque APRÈS nettoyage ==="
          df -h /
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupérer tout l'historique et les tags pour le versioning
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, gd, sqlite3, pdo_sqlite
          coverage: none
          ini-values: display_errors=On, display_startup_errors=On, error_reporting=E_ALL
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcb-dri3-0 \
            ghostscript
      
      - name: Install dependencies
        run: npm install
        
      - name: Install Composer and PHP dependencies
        run: |
          echo "Installation de Composer..."
          curl -sS https://getcomposer.org/installer | php
          php composer.phar --version
          
          echo "Installation des dépendances PHP..."
          cd app
          php ../composer.phar install --optimize-autoloader --ignore-platform-reqs
          cd ..
          
          echo "Vérification de vendor/..."
          if [ -f "app/vendor/autoload.php" ]; then
            echo "✅ vendor/autoload.php créé avec succès"
          else
            echo "❌ ERREUR: vendor/autoload.php introuvable"
            exit 1
          fi
        
      - name: Verify system PHP
        run: |
          php -v
          php -m
        
      - name: Run PHP Tests (Pest)
        run: |
          cd app
          echo "--- ExampleTest ---"
          ./vendor/bin/pest tests/ExampleTest.php || true
          echo "--- ConversionApiTest ---"
          ./vendor/bin/pest tests/Feature/ConversionApiTest.php || true
          echo "--- BibliothequeApiTest ---"
          ./vendor/bin/pest tests/Feature/BibliothequeApiTest.php || true
          echo "--- SessionManagerTest ---"
          ./vendor/bin/pest tests/Feature/SessionManagerTest.php || true
          echo "--- SecurePurgeApiTest ---"
          ./vendor/bin/pest tests/Feature/SecurePurgeApiTest.php || true
          echo "--- AutoTirageTest ---"
          ./vendor/bin/pest tests/Feature/AutoTirageTest.php || true
          echo "--- FULL SUITE ---"
          ./vendor/bin/pest
          cd ..
        
      - name: Run JS Tests (Jest)
        run: |
          npm test
      - name: Cleanup unnecessary files to save disk space
        run: |
          echo "=== Nettoyage agressif pour libérer de l'espace ==="
          df -h / | grep "/"
          
          echo ""
          echo "Suppression du cache npm..."
          npm cache clean --force
          
          echo "Vider le dossier php/..."
          if [ -d "php/" ]; then
            echo "Taille php/: $(du -sh php/ | cut -f1)"
            rm -rf php/*
          fi
          mkdir -p php/
          
          echo "Nettoyage des fichiers temporaires de l'application..."
          rm -rf app/public/tmp/* || true
          rm -rf app/public/sauvegarde/* || true
          rm -rf app/tmp/* || true
          echo "Fichiers temporaires supprimés"
          
          echo "Nettoyage du cache electron-builder..."
          rm -rf ~/.cache/electron-builder || true
          
          echo "Nettoyage node_modules/.cache..."
          rm -rf node_modules/.cache || true
          
          echo ""
          echo "=== Espace libéré ==="
          df -h / | grep "/"
        
      - name: Check package.json version
        run: |
          echo "=== Vérification de la version dans package.json ==="
          CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "Version actuelle: $CURRENT_VERSION"
          echo "✅ Utilisation de la version actuelle pour le build"
        
      - name: Pre-build check
        run: |
          echo "=== Vérifications avant build ==="
          echo "Espace disque:"
          df -h /
          echo ""
          echo "Nettoyage du dossier dist/..."
          rm -rf dist/
          echo "✅ dist/ nettoyé"
          echo ""
          echo "Dossiers présents:"
          ls -la
          echo ""
          echo "Fichiers dans caddy/:"
          ls -la caddy/ || echo "❌ Pas de dossier caddy/"
          echo ""
          echo "Fichiers dans app/:"
          ls -la app/ | head -20 || echo "❌ Pas de dossier app/"
          echo ""
          echo "Dossier php/ existe?"
          ls -la php/ 2>&1 | head -5 || echo "✅ php/ n'existe pas (normal pour Linux)"
        
      - name: Remove app/.git directory
        run: |
          echo "=== Suppression du dossier app/.git ==="
          if [ -d "app/.git" ]; then
            echo "Suppression de app/.git (non nécessaire pour le build)..."
            rm -rf app/.git
            echo "✅ app/.git supprimé"
          else
            echo "✅ app/.git n'existe pas (déjà supprimé ou absent)"
          fi
      
      - name: Build Linux AppImage
        run: |
          echo "=== Nettoyage final avant build ==="
          rm -rf dist/ ~/.cache/electron ~/.cache/electron-builder
          echo "✅ Caches nettoyés"
          echo ""
          echo "=== Build Linux AppImage avec debug ==="
          npm run build:caddy -- --publish=never 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT_CODE"
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build a échoué avec le code $BUILD_EXIT_CODE"
            echo "=== Dernières lignes du log ==="
            tail -50 build.log
            exit $BUILD_EXIT_CODE
          fi
          echo "✅ Build réussi"
        
      - name: Verify AppImage
        run: |
          echo "=== Vérification de l'AppImage ==="
          VERSION=$(node -p "require('./package.json').version")
          # Chercher l'AppImage avec le pattern correct (peut être -x86_64 ou autre architecture)
          APPIMAGE_FILE=$(ls dist/Duplicator-${VERSION}*.AppImage 2>/dev/null | head -1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "❌ AppImage manquant"
            echo "Fichiers disponibles dans dist/:"
            ls -la dist/
            exit 1
          fi
          echo "Version: $VERSION"
          echo "Fichier trouvé: $APPIMAGE_FILE"
          
          if [ -f "$APPIMAGE_FILE" ]; then
            echo "✅ AppImage créé"
            ls -lh "$APPIMAGE_FILE"
            chmod +x "$APPIMAGE_FILE"
            echo "📊 Taille de l'AppImage: $(du -h "$APPIMAGE_FILE" | cut -f1)"
            echo "🔍 Type de fichier: $(file "$APPIMAGE_FILE")"
          else
            echo "❌ AppImage manquant"
            echo "Fichiers disponibles dans dist/:"
            ls -la dist/
            exit 1
          fi
        
      - name: Extract and verify AppImage contents
        run: |
          echo "=== Extraction de l'AppImage ==="
          VERSION=$(node -p "require('./package.json').version")
          # Chercher l'AppImage avec le pattern correct (peut être -x86_64 ou autre architecture)
          APPIMAGE_FILE=$(ls dist/Duplicator-${VERSION}*.AppImage 2>/dev/null | head -1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "❌ AppImage non trouvé"
            ls -la dist/
            exit 1
          fi
          echo "Extraction de: $APPIMAGE_FILE"
          ./"$APPIMAGE_FILE" --appimage-extract
          
          echo "Vérification du contenu..."
          # Sans ASAR, les fichiers sont dans resources/app/ au lieu de resources/app.asar.unpacked/
          if [ -f "squashfs-root/resources/app/caddy/caddy" ]; then
            echo "✅ Caddy présent"
            squashfs-root/resources/app/caddy/caddy version
          else
            echo "❌ Caddy manquant"
            exit 1
          fi
          
          # PHP n'est plus inclus dans l'AppImage Linux - on utilise PHP système
          if [ -f "squashfs-root/resources/app/php/php" ]; then
            echo "⚠️ PHP présent dans l'AppImage (ne devrait pas être là pour Linux)"
          else
            echo "✅ PHP non inclus (utilisation du PHP système)"
          fi
          
          # Vérifier que la page d'aide PHP est incluse
          if [ -f "squashfs-root/resources/app/php-install-guide.html" ]; then
            echo "✅ Page d'aide PHP présente"
          else
            echo "❌ Page d'aide PHP manquante"
            exit 1
          fi
          
          if [ -f "squashfs-root/resources/app/Caddyfile" ]; then
            echo "✅ Caddyfile présent"
          else
            echo "❌ Caddyfile manquant"
            exit 1
          fi
        
      - name: Test Caddy configuration
        run: |
          echo "=== Test de la configuration Caddy ==="
          echo "🔍 Recherche du binaire Caddy..."
          find squashfs-root -name "caddy" -type f 2>/dev/null || echo "Binaire caddy non trouvé"
          find squashfs-root -name "caddy.exe" -type f 2>/dev/null || echo "Binaire caddy.exe non trouvé"
          
          echo "🔍 Recherche du Caddyfile..."
          find squashfs-root -name "Caddyfile" -type f 2>/dev/null || echo "Caddyfile non trouvé"
          
          echo "📁 Structure du dossier resources:"
          ls -la squashfs-root/resources/ 2>/dev/null || echo "Dossier resources non trouvé"
          
          echo "📁 Structure du dossier app (sans ASAR):"
          ls -la squashfs-root/resources/app/ 2>/dev/null || echo "Dossier app non trouvé"
          
          echo "📁 Contenu du dossier caddy:"
          ls -la squashfs-root/resources/app/caddy/ 2>/dev/null || echo "Dossier caddy non trouvé"
          
          echo "🔍 Vérification des permissions du binaire Caddy:"
          if [ -f "squashfs-root/resources/app/caddy/caddy" ]; then
            ls -la squashfs-root/resources/app/caddy/caddy
            echo "Test d'exécution du binaire Caddy:"
            squashfs-root/resources/app/caddy/caddy version 2>&1 || echo "Erreur d'exécution du binaire Caddy"
          else
            echo "❌ Binaire Caddy non trouvé"
          fi
          
          # Test de validation si les fichiers existent
          if [ -f "squashfs-root/resources/app/caddy/caddy" ] && [ -f "squashfs-root/resources/app/Caddyfile" ]; then
            echo "✅ Validation de la configuration Caddy..."
            squashfs-root/resources/app/caddy/caddy validate --config squashfs-root/resources/app/Caddyfile
          else
            echo "⚠️  Impossible de valider la configuration Caddy (fichiers manquants)"
          fi
        
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: duplicator-linux-appimage
          path: dist/Duplicator-*.AppImage
          retention-days: 7
        
      - name: Test summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "✅ TEST LINUX TERMINÉ"
          echo "════════════════════════════════════════"
          echo ""
          echo "L'AppImage est disponible dans les artifacts"

