name: Sync to dupli-electron-caddy and trigger release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'test_*.php'
      - '*.md'
      - '.gitignore'
      - 'CHANGELOG_*.md'
      - 'COMPORTEMENT_*.md'
      - 'GUIDE_*.md'
      - 'README_*.md'
      - 'RESUME_*.md'
      - 'TAUX_REMPLISSAGE.md'
      - 'GITHUB_SETUP.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout dupli-php-dev
        uses: actions/checkout@v4
        with:
          path: source
          token: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Checkout dupli-electron-caddy
        uses: actions/checkout@v4
        with:
          repository: MuArF/dupli-electron-caddy
          token: ${{ secrets.ELECTRON_CADDY_TOKEN || secrets.GITHUB_TOKEN }}
          path: target
          ref: main
          fetch-depth: 0
    
      - name: Get commit message from source
        id: commit_msg
        run: |
          cd source
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
    
      - name: Get version from package.json
        id: get_version
        run: |
          cd target
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
    
      - name: Sync files using Git (clone and copy)
        run: |
          cd target
          
          # Configurer Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TOKEN="${{ secrets.ELECTRON_CADDY_TOKEN || secrets.GITHUB_TOKEN }}"
          git remote set-url origin https://x-access-token:$TOKEN@github.com/MuArF/dupli-electron-caddy.git
          
          # S'assurer d'avoir la dernière version de main
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          
          # Supprimer l'ancien dossier app/ pour repartir à zéro
          rm -rf app/
          
          # Cloner dupli-php-dev dans un dossier temporaire
          git clone --depth 1 https://github.com/MuArF/dupli-php-dev.git temp-source
          
          # Copier les fichiers en excluant ce qu'il faut
          mkdir -p app
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tmp' \
            --exclude='sessions' \
            --exclude='uploads' \
            --exclude='sauvegarde' \
            --exclude='backups' \
            --exclude='downloads' \
            --exclude='*.db' \
            --exclude='*.sqlite' \
            --exclude='test_*.php' \
            --exclude='*.bat' \
            --exclude='test.pdf' \
            --exclude='cookies.txt' \
            --exclude='conti' \
            --exclude='.gitignore' \
            --exclude='PROMPT_NEXT_ASSISTANT.md' \
            --exclude='DIFF_ANALYSIS.md' \
            temp-source/ app/
          
          # Nettoyer
          rm -rf temp-source
          
          # Afficher un résumé
          echo "Files synced to app/:"
          find app/ -type f | wc -l | xargs echo "Total files:"
    
      - name: Commit and push to dupli-electron-caddy
        run: |
          cd target
          
          git add app/
          
          # Toucher un fichier pour forcer un changement si aucun changement détecté
          if git diff --staged --quiet; then
            # Forcer un changement en modifiant un timestamp dans un fichier .sync
            echo "# Last sync: $(date -u +"%Y-%m-%d %H:%M:%S UTC") - Commit: ${{ github.sha }}" > app/.sync-timestamp
            git add app/.sync-timestamp
            echo "No file changes detected, forcing sync with timestamp file"
          fi
          
          # Créer le commit avec tous les changements
          git commit -m "Sync from dupli-php-dev: ${{ steps.commit_msg.outputs.message }}
          
          Auto-sync triggered by: ${{ github.sha }}"
          git push origin main
          echo "HAS_CHANGES=true" >> $GITHUB_ENV
    
      - name: Trigger release workflow
        if: env.HAS_CHANGES == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Déclencher le workflow de release dans dupli-electron-caddy
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: 'MuArF',
                repo: 'dupli-electron-caddy',
                workflow_id: 'release.yml',
                ref: 'main'
              });
              console.log('Release workflow triggered in dupli-electron-caddy');
            } catch (error) {
              console.log('Could not trigger release workflow:', error.message);
              console.log('This is not critical, the sync was successful.');
            }

